# Veröffentlicht das Spiel auf GitHub Pages.
# Läuft bei jedem Push auf main und auf Knopfdruck (Reiter "Actions" → "Run workflow").
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Was dieser Workflow darf: Code lesen, auf Pages veröffentlichen.
permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Veröffentlichungen gleichzeitig.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v7

      - name: Prüfen (CI)
        # Lässt Node jede JavaScript-Datei in js/ auf Syntaxfehler prüfen.
        # Geht dabei etwas schief, bricht der Workflow ab und nichts wird veröffentlicht.
        run: |
          for f in js/*.js; do node --check "$f"; done
          echo "Syntax ok"

      - name: Website zusammenstellen (Build)
        # Nur das, was online gehört, kommt in den Ordner _site.
        # Danach bekommt jede CSS-/JS-Adresse die Commit-Kennung angehängt (z. B. js/render.js?v=5bb8100).
        # So holt der Browser nach jedem Update sofort die neuen Dateien statt seiner gespeicherten Kopie.
        run: |
          mkdir _site
          cp -r index.html css js _site/
          V="${GITHUB_SHA::7}"
          sed -i -E "s#(src=\"js/[a-z]+\.js)\"#\1?v=$V\"#g; s#(href=\"css/[a-z]+\.css)\"#\1?v=$V\"#g" _site/index.html
          grep -c "?v=$V" _site/index.html

      - name: Pages vorbereiten
        uses: actions/configure-pages@v6

      - name: Paket hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Veröffentlichen (Deploy)
        id: deployment
        uses: actions/deploy-pages@v5
